[project]
name = "prime-land"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "S-Akalanka", email = "sasiri.akalankaa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipykernel>=7.4.0",
    "langchain-core>=1.6.12",
    "langchain-qdrant>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "markdownify>=1.2.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
prime-land = "prime_land:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
